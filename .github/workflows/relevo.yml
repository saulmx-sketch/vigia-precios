name: relevo
# Relevo de la cadena del vigia: cuando termina una corrida de "vigia", comprueba que haya dejado lanzada
# la siguiente; si no, la relanza y abre un aviso. Solo relanza y avisa: nunca revisa ni guarda estado.
# Toda la logica vive en .github/scripts/relevo.sh (se prueba con pruebas/simular_relevo.sh).
on:
  workflow_run:
    workflows: [vigia]
    types: [completed]
  # Plan B: cada corrida de vigia lanza este flujo en su primer paso, con su numero. El trabajo "vigilar"
  # pasa por el entorno "espera" (13 min) y arranca cuando esa corrida ya termino y su sucesora deberia
  # estar esperando. Sirve tambien si el evento workflow_run nunca llega.
  workflow_dispatch:
    inputs:
      corrida:
        description: 'Numero de la corrida de vigia que lanzo este relevo (vacio = disparo a mano)'
        type: string
        default: ''
permissions:
  actions: write
  issues: write
  contents: read
concurrency:
  group: relevo
  cancel-in-progress: false
jobs:
  vigilar:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: espera
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Relanzar la cadena si quedo detenida (plan B)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TERMINO_ID: ${{ inputs.corrida }}
        run: bash .github/scripts/relevo.sh
  relevo:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    # 12 y no 5: con GitHub fallando, cuentas + 45 s + 5 lanzamientos + aviso pasan de 5 minutos, y un
    # relevo cortado por tope no avisa a nadie.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Relanzar la cadena si quedo detenida
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TERMINO_ID: ${{ github.event.workflow_run.id }}
          TERMINO_URL: ${{ github.event.workflow_run.html_url }}
          TERMINO_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TERMINO_HORA: ${{ github.event.workflow_run.updated_at }}
          TERMINO_EVENTO: ${{ github.event.workflow_run.event }}
        run: bash .github/scripts/relevo.sh
