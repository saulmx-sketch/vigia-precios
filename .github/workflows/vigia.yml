name: vigia
# Cadena: cada corrida espera 13 minutos (regla "wait timer" del entorno "espera", que no ocupa maquina),
# revisa tiendas y foro, y al terminar lanza la siguiente. No depende del horario de GitHub, que en esta
# cuenta llega con horas de retraso.
# El horario solo es salvavidas: NO revisa ni guarda nada; si la cadena se detuvo, la relanza.
# (Hasta el 21-nov el horario tambien revisaba y guardaba, se encimaba con la cadena y chocaba al guardar
# visto.json: tres "Run failed" el 20 y 21 de noviembre.)
on:
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Mandar un aviso de prueba'
        type: boolean
        default: false
  schedule:
    - cron: '13 */2 * * *'
permissions:
  contents: write
  issues: write
  actions: write
jobs:
  salvavidas:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Relanzar la cadena solo si esta detenida
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUIEN_RELANZA: el horario salvavidas
        run: |
          # Reintentos: el 25-nov GitHub respondio HTTP 500 a una sola peticion y la cadena se corto 8 horas.
          for intento in 1 2 3 4 5; do
            vivas=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow vigia.yml --limit 30 --json databaseId,status,event \
              --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID) | select(.event != \"schedule\") | select(.status != \"completed\")] | length") && break
            sleep $((intento * 15))
          done
          echo "corridas de la cadena vivas: $vivas"
          if [ "$vivas" != "0" ]; then
            echo "la cadena sigue viva (o no se pudo saber): nada que hacer"
            exit 0
          fi
          for intento in 1 2 3 4 5; do
            if gh workflow run vigia.yml --repo "$GITHUB_REPOSITORY" --ref main; then
              echo "la cadena estaba detenida: relanzada (intento $intento)"
              bash .github/scripts/aviso.sh relanzada || true
              exit 0
            fi
            sleep $((intento * 15))
          done
          echo "no se pudo relanzar la cadena tras 5 intentos"
          bash .github/scripts/aviso.sh detenida || true
          exit 1
  revisar:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment: espera
    timeout-minutes: 12
    env:
      # Sin compilados de Python en la carpeta: el paso "Guardar" sube todo lo que encuentre (git add -A).
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
      # Plan B del relevo: lanza ya el relevo de esta corrida; pasa 13 min en el entorno "espera" y revisa
      # que esta corrida haya dejado sucesora. Si este paso falla, la cadena sigue igual (queda el salvavidas).
      - name: Lanzar el relevo de esta corrida
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run relevo.yml --repo "$GITHUB_REPOSITORY" --ref main -f corrida="$GITHUB_RUN_ID"
      # Pruebas antes de revisar. Si una falla se apaga solo su parte y la revision de precios sigue:
      # un vigia ciego en Black Friday por una prueba fragil es peor que el fallo que evita.
      - name: Pruebas del nucleo
        id: pruebas
        continue-on-error: true
        timeout-minutes: 2
        env:
          SELFTEST_SOLO_NUCLEO: '1'
        run: python3 vigia.py --selftest
      - name: Pruebas de prospectiva
        id: pruebas_a
        if: hashFiles('prospectiva.py') != ''
        continue-on-error: true
        timeout-minutes: 1
        run: python3 prospectiva.py --selftest
      - name: Pruebas de promociones
        id: pruebas_b
        if: hashFiles('promos.py') != ''
        continue-on-error: true
        timeout-minutes: 1
        run: python3 promos.py --selftest
      # "cancelled" (la prueba llego a su tope) cuenta como falla, igual que "failure".
      - name: Aviso de pruebas fallidas
        if: >-
          steps.pruebas.outcome == 'failure' || steps.pruebas.outcome == 'cancelled' ||
          steps.pruebas_a.outcome == 'failure' || steps.pruebas_a.outcome == 'cancelled' ||
          steps.pruebas_b.outcome == 'failure' || steps.pruebas_b.outcome == 'cancelled'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          P_NUCLEO: ${{ steps.pruebas.outcome }}
          P_A: ${{ steps.pruebas_a.outcome }}
          P_B: ${{ steps.pruebas_b.outcome }}
          LIGA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cuerpo="Antes de revisar las tiendas, el vigía corre sus propias pruebas. En la corrida de $(date -u -d '-6 hours' '+%d-%m-%Y a las %H:%M') (hora de la Ciudad de México) fallaron:"
          partes=""
          fallo() { [ "$1" = "failure" ] || [ "$1" = "cancelled" ]; }
          if fallo "$P_NUCLEO"; then partes="$partes, núcleo"; cuerpo="$cuerpo
          - Las pruebas del núcleo: mientras sigan fallando, el vigía lee y guarda precios, pero NO manda avisos de precio."; fi
          if fallo "$P_A"; then partes="$partes, prospectiva"; cuerpo="$cuerpo
          - Las pruebas de prospectiva: esa parte queda apagada; los avisos de precio siguen."; fi
          if fallo "$P_B"; then partes="$partes, promociones"; cuerpo="$cuerpo
          - Las pruebas de promociones: esa parte queda apagada; los avisos de precio siguen."; fi
          cuerpo="$cuerpo

          (Una prueba que no terminó a tiempo cuenta como fallida.) Cada corrida vuelve a probar: si la prueba pasa, la parte se prende sola. Liga a la corrida: $LIGA"
          bash .github/scripts/aviso.sh libre "Fallaron pruebas del vigía (${partes#, }): esa parte quedó apagada" "$cuerpo"
      - name: Revisar tiendas y foro
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRUEBA: ${{ inputs.prueba }}
          SIN_AVISOS_PRECIO: ${{ steps.pruebas.outcome != 'success' && '1' || '' }}
          SIN_PROSPECTIVA: ${{ (steps.pruebas_a.outcome == 'failure' || steps.pruebas_a.outcome == 'cancelled') && '1' || '' }}
          SIN_PROMOS: ${{ (steps.pruebas_b.outcome == 'failure' || steps.pruebas_b.outcome == 'cancelled') && '1' || '' }}
        run: python3 vigia.py
      - name: Guardar memoria y bitacora de precios
        if: always()
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "sin cambios que guardar"
            exit 0
          fi
          git config user.name "vigia"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "estado del vigia"
          # Si otra corrida guardo antes, se reintegra; en un choque gana el estado de esta corrida (la mas nueva).
          for intento in 1 2 3; do
            if git pull --rebase -X theirs && git push; then
              echo "guardado (intento $intento)"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((intento * 7))
          done
          echo "no se pudo guardar tras 3 intentos"
          exit 1
      - name: Lanzar la siguiente corrida de la cadena
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Reintentos: el 25-nov GitHub respondio HTTP 500 a una sola peticion y la cadena se corto 8 horas.
          # Si no se puede saber si hay otra corrida viva, se lanza igual: dos cadenas se notan y se corrigen;
          # una cadena muerta no avisa a nadie.
          otras=0
          for intento in 1 2 3 4 5; do
            otras=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow vigia.yml --limit 30 --json databaseId,status,event \
              --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID) | select(.event != \"schedule\") | select(.status != \"completed\")] | length") && break
            otras=0
            sleep $((intento * 15))
          done
          echo "otras corridas vivas: $otras"
          if [ "$otras" != "0" ]; then
            echo "ya hay otra corrida esperando: esta no encadena"
            exit 0
          fi
          for intento in 1 2 3 4 5; do
            if gh workflow run vigia.yml --repo "$GITHUB_REPOSITORY" --ref main; then
              echo "siguiente corrida lanzada (intento $intento)"
              exit 0
            fi
            sleep $((intento * 15))
          done
          echo "no se pudo lanzar la siguiente corrida tras 5 intentos"
          exit 1
