name: sondeo
# TEMPORAL (linea C, encargo 04): corre relevo.sh en seco contra la cadena real. Se revierte en el commit siguiente.
on:
  workflow_dispatch:
permissions:
  actions: read
  issues: read
  contents: read
jobs:
  sondear:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Relevo en seco
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEVO_SECO: '1'
        run: bash .github/scripts/relevo.sh
