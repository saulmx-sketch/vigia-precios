name: sondeo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sondear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 sondeo.py
      - run: |
          git config user.name "vigia"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "sondeo" || true
          git push
